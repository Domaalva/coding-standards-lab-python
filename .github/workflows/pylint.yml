
name: Python Pylint

on:
  pull_request:
    branches:
      - main

jobs:
  pylint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Pylint
        run: python -m pip install pylint==4.1.2

      - name: Run Pylint
        run: python -m pylint test.py
